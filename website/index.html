<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl42 NFT Minting</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <main class="container">
        <header>
            <h1>Girl42</h1>
            <p class="subtitle">A one-of-one ERC721 on Sepolia &middot; art by Horzeau</p>
        </header>

        <section class="card">
            <div class="wallet-bar">
                <span id="networkBadge" class="badge" hidden></span>
                <span id="walletAddress" class="address" hidden></span>
                <button id="connectButton" class="btn btn-secondary">Connect Wallet</button>
                <button id="switchButton" class="btn btn-secondary" hidden>Switch network</button>
            </div>

            <div id="artFrame" class="art-frame">
                <div id="placeholder" class="placeholder">
                    <span class="placeholder-mark">?</span>
                    <span id="placeholderText" class="placeholder-text">Not minted yet</span>
                </div>
                <img id="nftImage" alt="Girl42 NFT artwork" hidden>
            </div>

            <dl id="nftDetails" class="details" hidden>
                <dt>Name</dt><dd id="nftName"></dd>
                <dt>Description</dt><dd id="nftDescription"></dd>
                <dt>Token ID</dt><dd>#1</dd>
                <dt>Owner</dt><dd id="nftOwner"></dd>
                <dt>Metadata</dt><dd id="nftMetadata"></dd>
            </dl>

            <button id="mintButton" class="btn btn-primary" disabled>Mint NFT</button>
            <div id="status" class="status"></div>
        </section>

        <footer id="contractInfo" class="footer"></footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.7.5/dist/web3.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
